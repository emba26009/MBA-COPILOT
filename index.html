<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBA Copilot</title><style>body{font-family:Inter,Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:22px 6vw}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-bottom:18px}select,textarea,button{font:inherit;border-radius:10px;padding:11px}select,textarea{width:100%;box-sizing:border-box;border:1px solid #d1d5db}textarea{min-height:120px}.modes{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.modes button{border:1px solid #ddd;background:white;cursor:pointer}.modes .active{background:#111827;color:white}.askrow{display:flex;gap:10px}.askrow button{flex:1;border:0;color:#fff;cursor:pointer}.cop{background:#2563eb}.gpt{background:#111827}.answer{line-height:1.7}.ref{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;padding:3px 7px;border-radius:7px;cursor:pointer}.src{padding:10px;background:#f8fafc;margin:6px 0;border-radius:8px;cursor:pointer}.viewer{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.viewer.open{display:flex}.vcard{background:#fff;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:20px;border-radius:16px}.note{font-size:12px;color:#667085}@media(max-width:700px){.askrow{flex-direction:column}}</style></head><body><header><h1>🎓 MBA Copilot</h1><div>Your MBA material → your AI tutor</div></header><div class="wrap"><div class="card"><label>Subject</label><select id="subject"></select><label>Learning mode</label><div class="modes"><button class="active" data-mode="Teach Me">📖 Teach Me</button><button data-mode="Explain Simply">💡 Explain</button><button data-mode="Memorize">🧠 Memorize</button><button data-mode="Exam Prep">🎯 Exam Prep</button><button data-mode="Business Use">🏢 Business Use</button><button data-mode="Case Analysis">📚 Case</button><button data-mode="Quiz Me">🧪 Quiz</button></div><textarea id="q" placeholder="Ask something like: What is fixed cost? Explain with my course material."></textarea><div class="askrow"><button class="cop" id="ask">📚 Ask MBA Copilot</button><button class="gpt" id="askgpt">🤖 Ask GPT</button></div><p class="note">📚 uses your MBA library. 🤖 uses general GPT knowledge and is not course-grounded.</p><div id="status" class="note"></div></div><div class="card" id="result" style="display:none"><div id="answer" class="answer"></div><hr><h3>📑 Sources</h3><div id="sources"></div></div></div><div id="viewer" class="viewer" onclick="if(event.target===this)closeV()"><div class="vcard"><button onclick="closeV()">Close</button><h2 id="vt"></h2><div id="vl" class="note"></div><pre id="vx" style="white-space:pre-wrap"></pre></div></div><script>let mode='Teach Me',refs={};document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function md(t){return esc(t).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\[\[SOURCE (\d+)\]\]/g,(m,n)=>refs['src_'+(Number(n)-1)]?`<button class="ref" onclick="openS('src_${Number(n)-1}')">📑 Source ${n}</button>`:m).replace(/\[\[([^\]]+)\]\]/g,(m,l)=>{let k=Object.keys(refs).find(x=>(refs[x].locator+' '+refs[x].document).toLowerCase().includes(l.toLowerCase()));return k?`<button class="ref" onclick="openS('${k}')">📑 ${esc(l)}</button>`:m}).replace(/\n/g,'<br>')}async function load(){let d=await fetch('/api/meta').then(r=>r.json());subject.innerHTML=d.subjects.map(x=>`<option>${esc(x)}</option>`).join('');status.textContent=`${d.chunks} course passages · GPT ${d.ai_configured?'ready':'API key not configured'}`}async function run(url){let q=document.getElementById('q').value.trim();if(!q)return;result.style.display='block';answer.innerHTML='<p>Thinking…</p>';sources.innerHTML='';let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,subject:subject.value,mode})});let d=await r.json();if(d.error){answer.innerHTML='<p>⚠️ '+esc(d.error)+'</p>';return}refs={};(d.sources||[]).forEach((s,i)=>refs[s.ref]=s);answer.innerHTML=(url.includes('ask-gpt')?'<p><b>🤖 General GPT Answer — not course-grounded</b></p>':'')+md(d.answer);sources.innerHTML=(d.sources||[]).map(s=>`<div class="src" onclick="openS('${s.ref}')">📑 <b>${esc(s.document)}</b> — ${esc(s.locator)}</div>`).join('')}ask.onclick=()=>run('/api/chat');askgpt.onclick=()=>run('/api/ask-gpt');function openS(k){let s=refs[k];if(!s)return;vt.textContent='📑 '+s.document;vl.textContent=s.locator;vx.textContent=s.text;viewer.classList.add('open')}function closeV(){viewer.classList.remove('open')}load();</script></body></html>
