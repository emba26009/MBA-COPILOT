databases:
  - name: mba-copilot-db
    plan: free
    databaseName: mba_copilot
    user: mba_copilot
    region: singapore

services:
  - type: web
    name: mba-copilot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mba-copilot-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: MBA_COPILOT_MODEL
        value: gpt-4.1-mini
