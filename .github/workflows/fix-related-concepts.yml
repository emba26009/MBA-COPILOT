name: Fix related concept ranking
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch related concept scoring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old="'capacity':['capacity','bottleneck','utilization','process capacity']}"
          new="'capacity':['capacity','bottleneck','utilization','process capacity'],'social psychology':['social psychology','social behavior','social behaviour','group behavior','group behaviour','social influence','interpersonal','group dynamics','perception','attitudes','group norms','roles','cohesiveness','social loafing'],'social behaviour':['social behaviour','social behavior','group behavior','group behaviour','social influence','interpersonal','group dynamics'],'social behavior':['social behavior','social behaviour','group behavior','group behaviour','social influence','interpersonal','group dynamics']}"
          if old not in s: raise SystemExit('CONCEPTS target not found')
          s=s.replace(old,new,1)
          old2="v=len(qt&tt)*1.5+sum(3 for x in terms if x in tl)+(8 if concept and concept in tl else 0)"
          new2="v=len(qt&tt)*1.5+sum(3 for x in terms if x in tl)+(8 if concept and concept in tl else 0)\n # For relational questions, reward meaningful course concepts even when the exact term is absent.\n related_bonus={'social psychology':['group behavior','group behaviour','social influence','interpersonal','group dynamics','perception','attitudes','group norms','roles','cohesiveness','social loafing'],'social behaviour':['group behavior','group behaviour','social influence','interpersonal','group dynamics'],'social behavior':['group behavior','group behaviour','social influence','interpersonal','group dynamics']}\n if concept in related_bonus: v += sum(7 for x in related_bonus[concept] if x in tl)"
          if old2 not in s: raise SystemExit('local_score target not found')
          s=s.replace(old2,new2,1)
          old3="core={'fixed cost':'A fixed cost does not change with activity within the relevant range.','variable cost':'A variable cost changes with the level of activity.','contribution':'Contribution equals selling price minus variable cost per unit.','break-even':'Break-even is the activity level where contribution covers fixed costs and profit is zero.'}.get(concept,f\"The supplied material contains evidence related to '{concept}'.\")"
          new3="core={'fixed cost':'A fixed cost does not change with activity within the relevant range.','variable cost':'A variable cost changes with the level of activity.','contribution':'Contribution equals selling price minus variable cost per unit.','break-even':'Break-even is the activity level where contribution covers fixed costs and profit is zero.','social psychology':'The supplied MBA material does not explicitly define social psychology as a standalone term. It covers closely related ideas such as group behaviour, interpersonal interaction, social influence, perception and attitudes, which explain how people are influenced by others in organizational settings.'}.get(concept,f\"The supplied material contains evidence related to '{concept}'.\")"
          if old3 not in s: raise SystemExit('heuristic target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Improve cross-subject related concept answers'
          git push
