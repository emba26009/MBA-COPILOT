name: Rename Ask GPT button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    if: github.event.head_commit.message != 'chore: apply Ask GPT rename'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="gpt" id="askgpt">🤖 Ask GPT</button>'
          new = '<button class="gpt" id="askgpt">📝 Summarise</button>'
          if old not in s:
              raise SystemExit('Ask GPT button text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: apply Ask GPT rename'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/rename-ask-gpt.yml
          git commit -m 'chore: remove temporary rename workflow'
          git push