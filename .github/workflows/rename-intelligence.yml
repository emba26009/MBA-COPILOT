name: Rename Ask More to Intelligence
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename button and workspace title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<button class="more" id="askmore">✨ Ask More</button>': '<button class="more" id="askmore">🧠 Intelligence</button>',
              '<h2>✨ Ask More — Full AI Workspace</h2>': '<h2>🧠 Intelligence — Full AI Workspace</h2>'
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('Ask More text not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename Ask More to Intelligence'
          git push
