name: Sort MBA subjects by trimester
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update subject selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function fillSubjects(a){a=[...new Set((a||[]).filter(Boolean))];if(!a.length)a=FALLBACK;let o=a.map(x=>`<option value=\\\"${esc(x)}\\\">${esc(x)}</option>`).join('');$('subject').innerHTML=o;$('uploadSubject').innerHTML=o}"
          new="""function fillSubjects(a){a=[...new Set((a||[]).filter(Boolean))];if(!a.length)a=FALLBACK;const t1=['Behaviour in Organizations','Financial Reporting and Management Accounting','Business Statistics for Managers','Digital Transformation','Operations Management'];const t2=['Action Lab: Systems Thinking for Problem Solving','Artificial Intelligence for Business','Managerial Economics and Macroeconomic Environment','Marketing Management–I: Marketing Management Using AI','Supply Chain Management'];const clean=x=>String(x).trim();a=a.map(clean);const one=t1.filter(x=>a.includes(x)),two=t2.filter(x=>a.includes(x));const rest=a.filter(x=>!t1.includes(x)&&!t2.includes(x));let o='<optgroup label=\\\"TRIMESTER 1\\\">'+one.map(x=>`<option value=\\\"${esc(x)}\\\">${esc(x)}</option>`).join('')+'</optgroup><optgroup label=\\\"TRIMESTER 2\\\">'+two.map(x=>`<option value=\\\"${esc(x)}\\\">${esc(x)}</option>`).join('')+'</optgroup>';if(rest.length)o+='<optgroup label=\\\"OTHER / UNASSIGNED\\\">'+rest.map(x=>`<option value=\\\"${esc(x)}\\\">${esc(x)}</option>`).join('')+'</optgroup>';$('subject').innerHTML=o;$('uploadSubject').innerHTML=o}"""
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Sort subjects by trimester'
          git push
