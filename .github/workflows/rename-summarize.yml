name: Rename Ask GPT to Summarize
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<button class="gpt" id="askgpt">🤖 Ask GPT</button>'
          new='<button class="gpt" id="askgpt">📝 Summarize</button>'
          if old not in s:
              raise SystemExit('target button text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename Ask GPT button to Summarize'
          git push
