name: Enable Cross-Subject Knowledge
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cross-subject patch
        run: |
          python cross_subject_patch.py
          python -m py_compile app.py
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Make MBA knowledge retrieval cross-subject'
          git push
