name: Intelligence opens Generative AI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Intelligence open Generative AI directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "$('askmore').onclick=()=>{$('morebox').classList.toggle('hidden');if(!$('morebox').classList.contains('hidden')&&!chatMessages.length)newChat()}"
          new = "$('askmore').onclick=()=>{aiMode='generative';document.querySelectorAll('.mode-card').forEach(x=>x.classList.toggle('active',x.dataset.ai==='generative'));$('modeBadge').textContent='✨ Generative AI';$('morebox').classList.remove('hidden');if(!chatMessages.length)newChat();$('morebox').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('chatinput').focus(),350)}"
          if old not in s:
              raise SystemExit('Expected Intelligence click handler was not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "aiMode='generative'" in s
          assert "$('morebox').scrollIntoView" in s
          assert "$('modeBadge').textContent='✨ Generative AI'" in s
          print('Validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Intelligence open Generative AI chat directly"
          git push
